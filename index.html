<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE4">
<title>Chante-la</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE4; --paper-2:#EAE3D5; --ink:#1C1A16; --muted:#8A8378; --rule:#D6CDBC;
  --red:#D2462A; --red-ink:#A8331C;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
a{color:var(--red-ink)}
svg{display:block}
.view{height:100%;display:flex;flex-direction:column}
.wrap{max-width:620px;margin:0 auto;width:100%;padding:0 20px}

/* ---------- Accueil ---------- */
#home .bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#code{text-decoration:none;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--rule)}
#home h1{font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,15vw,5.2rem);line-height:.9;letter-spacing:-.02em;margin:28px 0 10px}
#home h1 i{color:var(--red)}
.lede{color:var(--muted);font-size:1.02rem;line-height:1.45;max-width:30ch;margin-bottom:28px}

#listen{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:4px 0}
.rec{flex:none;width:76px;height:76px;border-radius:50%;background:var(--red);display:grid;place-items:center;position:relative;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rec::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--paper)}
#listen:active .rec{transform:translateY(1px)}
#listen.on .rec::before{border-radius:4px;width:20px;height:20px}
#listen.on .rec::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--red);animation:ring 1.3s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.3);opacity:0}}
#listen b{display:block;font-weight:700;font-size:1.15rem}
#listen small{display:block;color:var(--muted);font-size:.92rem;margin-top:2px;line-height:1.35}
#listen:disabled{cursor:default}

.quota{display:flex;align-items:center;gap:10px;margin:18px 0 0 94px;font-size:.85rem;color:var(--muted)}
.ticks{display:flex;gap:4px}
.ticks span{width:5px;height:16px;border-radius:1px;background:var(--red);transform:skewX(-8deg)}
.ticks span.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}

.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.1rem;margin:30px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}

form{display:flex;align-items:flex-end;gap:14px;border-bottom:1.5px solid var(--ink)}
#q{flex:1;min-width:0;background:transparent;border:0;padding:12px 0 10px;font-size:1.1rem}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none}
form:focus-within{border-color:var(--red)}
.go{font-weight:700;padding:12px 0 10px;color:var(--red-ink)}
#status{color:var(--muted);margin:14px 0 4px;min-height:1.4em;font-size:.92rem}
#status.err{color:var(--red-ink)}
#results{list-style:none;padding:0 0 28px;overflow-y:auto;flex:1;counter-reset:n}
#results li{counter-increment:n}
#results button{width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:2.2em 1fr auto;gap:0 10px;align-items:baseline}
#results button::before{content:counter(n,decimal-leading-zero);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.r-title{font-family:var(--serif);font-size:1.35rem;line-height:1.15}
.r-meta{grid-column:2;color:var(--muted);font-size:.88rem;margin-top:2px}
.r-tag{grid-column:3;grid-row:1;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.r-tag.sync{color:var(--red-ink)}


/* ---------- Karaoké ---------- */
#player header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
#back{color:var(--ink)}
#now{min-width:0;flex:1}
#now b{display:block;font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now small{color:var(--muted);font-size:.85rem}
#relisten{border:1.5px solid var(--ink);position:relative}
#relisten::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--red)}
#relisten.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--red);animation:ring 1.3s ease-out infinite}
#hint{color:var(--muted);font-size:.85rem;text-align:center;padding:8px 16px 0}
#lyrics{flex:1;overflow-y:auto;padding:38vh 24px;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.line{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.12;color:var(--muted);opacity:.55;
  padding:9px 0 9px 16px;border-left:3px solid transparent;transition:color .3s,opacity .3s,border-color .3s}
.line.past{opacity:.3}
.line.on{color:var(--ink);opacity:1;border-left-color:var(--red)}
.line.gap{font-style:italic;font-size:1.4rem}
.plain{white-space:pre-wrap;font-family:var(--serif);font-size:1.45rem;line-height:1.45;padding-top:24px;-webkit-mask-image:none;mask-image:none}
#controls{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 14px;border-top:1px solid var(--rule)}
.ctl{height:40px;padding:0 10px;border-radius:999px;border:1.5px solid var(--rule);font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
#play{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.off{display:flex;align-items:center;gap:4px}
#offv{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
#clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:34px;text-align:right}

@media (prefers-reduced-motion:reduce){#lyrics{scroll-behavior:auto}.line{transition:none}#listen.on .rec::after,#relisten.on::after{animation:none;opacity:1}}
</style>
</head>
<body>

<section id="home" class="view">
  <div class="wrap">
    <div class="bar"><span>Karaoké</span><a id="code" href="https://github.com/collignonnoe/karaoke" target="_blank" rel="noopener">Code</a></div>
    <h1>Chante<i>-</i>la.</h1>
    <p class="lede">Fais écouter la musique au téléphone. Les paroles démarrent pile au bon moment.</p>

    <button id="listen">
      <span class="rec" aria-hidden="true"></span>
      <span><b id="listenTitle">Écouter la musique</b><small id="listenSub">8 secondes d'écoute, puis les paroles</small></span>
    </button>
    <div class="quota" id="quota" hidden>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <span id="quotaText"></span>
    </div>

    <div class="or">ou</div>
    <form id="f">
      <input id="q" type="search" placeholder="Titre et artiste" autocomplete="off" enterkeyhint="search" aria-label="Titre et artiste">
      <button class="go" type="submit">Chercher</button>
    </form>
    <p id="status" role="status"></p>
  </div>
  <ul id="results" class="wrap"></ul>
</section>

<section id="player" class="view" hidden>
  <header>
    <button id="back" class="icon" aria-label="Retour">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="now"><b id="t-title"></b><small id="t-artist"></small></div>
    <button id="relisten" class="icon" aria-label="Réécouter pour recaler"></button>
  </header>
  <p id="hint"></p>
  <div id="lyrics"></div>
  <div id="controls">
    <button class="ctl" id="restart" aria-label="Revenir au début">Début</button>
    <div class="off">
      <button class="ctl" id="minus" aria-label="Reculer de 0,5 seconde">-0,5</button>
      <span id="offv">0,0 s</span>
      <button class="ctl" id="plus" aria-label="Avancer de 0,5 seconde">+0,5</button>
    </div>
    <span id="clock">0:00</span>
    <button id="play" aria-label="Lecture"></button>
  </div>
</section>

<script src="shazam-sig.js"></script>
<script>
const $ = s => document.querySelector(s);
const LRC = "https://lrclib.net/api/search?";
const REC_SECONDS = 8;
// URL du mini-serveur Cloudflare (relaie l'empreinte à Shazam et compte les écoutes du jour)
const WORKER_URL = "https://karaoke.TONPSEUDO.workers.dev";
const HAS_WORKER = !WORKER_URL.includes("TONPSEUDO");

const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>';
const HINT = "Décalé ? Touche la ligne qu'on entend.";

let lines = [], els = [], cur = -1;
let playing = false, startAt = 0, pausedAt = 0, offset = 0, raf = 0, lock = null, busy = false;

// ---------- Réseau ----------
async function fetchRetry(url, opts, tries = 3) {
  for (let i = 1; i <= tries; i++) {
    try {
      const res = await fetch(url, opts);
      if (res.ok) return await res.json();
      if (res.status < 500) throw new Error("fatal " + res.status);
    } catch (e) {
      if (String(e.message).startsWith("fatal") || i === tries) throw e;
    }
    if (i < tries) await new Promise(r => setTimeout(r, 1500 * i));
  }
}
function setStatus(msg, err) { const s = $("#status"); s.textContent = msg; s.classList.toggle("err", !!err); }

// ---------- Compteur d'écoutes du jour ----------
function showQuota(remaining, limit) {
  const q = $("#quota");
  if (remaining == null) { q.hidden = true; return; }
  q.hidden = false;
  $("#ticks").innerHTML = Array.from({ length: limit }, (_, i) => `<span class="${i < remaining ? "" : "used"}"></span>`).join("");
  $("#quotaText").textContent = remaining === 0
    ? "Plus d'écoute aujourd'hui, reviens demain"
    : `${remaining} écoute${remaining > 1 ? "s" : ""} sur ${limit} aujourd'hui`;
}
async function loadQuota() {
  if (!HAS_WORKER) return showQuota(null);
  try { const d = await (await fetch(WORKER_URL)).json(); showQuota(d.remaining, d.limit); }
  catch (e) { showQuota(null); }
}

// ---------- Recherche par titre ----------
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").blur();
  setStatus("Recherche…");
  $("#results").innerHTML = "";
  try {
    const data = await fetchRetry(LRC + "q=" + encodeURIComponent(q));
    if (!data.length) return setStatus("Rien trouvé. Essaie avec le titre et l'artiste.", true);
    data.sort((a, b) => !!b.syncedLyrics - !!a.syncedLyrics);
    setStatus(data.length + " résultat" + (data.length > 1 ? "s" : ""));
    for (const s of data.slice(0, 25)) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.innerHTML = `<span class="r-title"></span><span class="r-tag"></span><span class="r-meta"></span>`;
      b.querySelector(".r-title").textContent = s.trackName;
      b.querySelector(".r-meta").textContent = s.artistName + (s.duration ? " · " + fmt(s.duration) : "");
      const tag = b.querySelector(".r-tag");
      if (s.syncedLyrics) { tag.textContent = "synchro"; tag.classList.add("sync"); }
      else tag.textContent = s.instrumental ? "instru" : "texte";
      b.onclick = () => open(s);
      li.appendChild(b);
      $("#results").appendChild(li);
    }
  } catch (err) {
    setStatus(navigator.onLine ? "Le serveur de paroles est surchargé. Réessaie dans quelques minutes." : "Pas de connexion internet.", true);
  }
});

// ---------- Reconnaissance (micro + AudD) ----------
async function record(seconds) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const t0 = performance.now();
  rec.start();
  await new Promise(r => setTimeout(r, seconds * 1000));
  rec.stop(); await done;
  stream.getTracks().forEach(t => t.stop());
  return { blob: new Blob(chunks, { type: rec.mimeType || "audio/webm" }), t0 };
}

// Décode l'enregistrement en PCM 16 bits mono 16 kHz (format attendu par l'empreinte)
async function toPCM16k(blob) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close && ctx.close();
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const mono = (await off.startRendering()).getChannelData(0);
  const pcm = new Int16Array(mono.length);
  for (let i = 0; i < mono.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(mono[i] * 32767)));
  return new Uint8Array(pcm.buffer);
}

async function recognize(say) {
  if (!HAS_WORKER) throw new Error("La reconnaissance n'est pas encore configurée.");

  let clip;
  try { say("J'écoute…", `Approche le téléphone de la musique, ${REC_SECONDS} secondes`); clip = await record(REC_SECONDS); }
  catch (e) { throw new Error("Micro refusé. Autorise le micro pour ce site dans les réglages du navigateur."); }

  say("Je cherche…", "Identification du morceau");
  let sig;
  try { sig = ShazamSig.signature(await toPCM16k(clip.blob)); } catch (e) {}
  if (!sig) throw new Error("Enregistrement illisible. Réessaie.");

  let r;
  try {
    r = await (await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sig) })).json();
  } catch (e) { throw new Error("Impossible de joindre le serveur de reconnaissance. Vérifie ta connexion."); }
  if (r.remaining != null) showQuota(r.remaining, r.limit);
  if (r.status === "error") throw new Error(r.error?.error_message || "Erreur de reconnaissance.");
  if (!r.result) throw new Error("Pas reconnu. Rapproche-toi de la musique et réessaie.");

  const { artist, title, timecode } = r.result;
  say("Trouvé.", `${title}, ${artist}. Chargement des paroles…`);
  const song = await findLyrics(artist, title);
  if (!song) throw new Error(`C'est ${title} de ${artist}, mais ses paroles ne sont pas disponibles.`);
  return { song, pos: tc(timecode), t0: clip.t0 };
}

async function findLyrics(artist, title) {
  const clean = s => s.replace(/\s*[\(\[].*?[\)\]]/g, "").replace(/\s+-\s+.*$/, "").trim();
  const tries = [
    "track_name=" + encodeURIComponent(clean(title)) + "&artist_name=" + encodeURIComponent(artist.split(/,|&| feat\.? /i)[0].trim()),
    "q=" + encodeURIComponent(clean(title) + " " + artist)
  ];
  let best = null;
  for (const qs of tries) {
    try {
      const data = await fetchRetry(LRC + qs);
      const synced = data.find(d => d.syncedLyrics);
      if (synced) return synced;
      best = best || data[0];
    } catch (e) {}
  }
  return best;
}

async function listenAndPlay(fromPlayer) {
  if (busy) return;
  busy = true;
  const btn = fromPlayer ? $("#relisten") : $("#listen");
  btn.classList.add("on"); btn.disabled = true;
  const say = fromPlayer
    ? (a, b) => { $("#hint").hidden = false; $("#hint").textContent = a + " " + b; }
    : (a, b) => { $("#listenTitle").textContent = a; $("#listenSub").textContent = b; setStatus(""); };
  try {
    const { song, pos, t0 } = await recognize(say);
    open(song);
    if (lines.length) {
      // position actuelle = début de l'extrait dans le morceau + temps écoulé depuis
      pausedAt = pos + (performance.now() - t0) / 1000;
      play();
    }
  } catch (e) {
    if (fromPlayer) $("#hint").textContent = e.message;
    else setStatus(e.message, true);
  } finally {
    busy = false;
    btn.classList.remove("on"); btn.disabled = false;
    $("#listenTitle").textContent = "Écouter la musique";
    $("#listenSub").textContent = "8 secondes d'écoute, puis les paroles";
  }
}
$("#listen").onclick = () => listenAndPlay(false);
$("#relisten").onclick = () => listenAndPlay(true);


// ---------- Parsing LRC ----------
function parseLRC(lrc) {
  const out = [];
  for (const raw of lrc.split(/\r?\n/)) {
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
    if (!tags.length) continue;
    const text = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of tags) out.push({ t: +m[1] * 60 + parseFloat(m[2].replace(":", ".")), text });
  }
  return out.sort((a, b) => a.t - b.t);
}

// ---------- Lecteur ----------
function open(song) {
  stop(); reset();
  $("#t-title").textContent = song.trackName;
  $("#t-artist").textContent = song.artistName;
  const box = $("#lyrics");
  box.innerHTML = ""; box.classList.remove("plain");
  lines = song.syncedLyrics ? parseLRC(song.syncedLyrics) : [];
  els = [];
  const synced = lines.length > 0;
  $("#controls").hidden = !synced;
  $("#hint").hidden = !synced;
  $("#hint").textContent = HINT;
  if (synced) {
    lines.forEach((l, i) => {
      const b = document.createElement("button");
      b.className = "line" + (l.text ? "" : " gap");
      b.textContent = l.text || "(musique)";
      b.onclick = () => jump(i);
      box.appendChild(b); els.push(b);
    });
  } else {
    box.classList.add("plain");
    box.textContent = song.plainLyrics || "Pas de paroles pour ce morceau.";
  }
  $("#home").hidden = true; $("#player").hidden = false;
  box.scrollTop = 0;
}

const now = () => playing ? (performance.now() - startAt) / 1000 : pausedAt;
const pos = () => now() + offset;

function tick() {
  const t = pos();
  $("#clock").textContent = fmt(Math.max(0, t));
  let i = -1;
  for (let k = 0; k < lines.length && lines[k].t <= t; k++) i = k;
  if (i !== cur) {
    els.forEach((el, k) => { el.classList.toggle("on", k === i); el.classList.toggle("past", k < i); });
    if (els[i]) els[i].scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
    cur = i;
  }
  if (playing) raf = requestAnimationFrame(tick);
}

function setPlayIcon() { $("#play").innerHTML = playing ? ICON_PAUSE : ICON_PLAY; $("#play").setAttribute("aria-label", playing ? "Pause" : "Lecture"); }
function play() {
  startAt = performance.now() - pausedAt * 1000;
  playing = true; setPlayIcon();
  wake(true); cur = -1; tick();
}
function stop() {
  if (playing) pausedAt = now();
  playing = false; cancelAnimationFrame(raf); setPlayIcon();
  wake(false);
}
function reset() { pausedAt = 0; offset = 0; cur = -1; showOff(); $("#clock").textContent = "0:00"; }

// Toucher une ligne = "on est ici maintenant"
function jump(i) {
  offset = lines[i].t - now();
  showOff(); cur = -1;
  if (!playing) play(); else tick();
}
function nudge(d) { offset += d; showOff(); cur = -1; if (!playing) tick(); }
function showOff() { $("#offv").textContent = (offset >= 0 ? "+" : "") + offset.toFixed(1).replace(".", ",") + " s"; }

$("#play").onclick = () => playing ? stop() : play();
$("#plus").onclick = () => nudge(0.5);
$("#minus").onclick = () => nudge(-0.5);
$("#restart").onclick = () => { const was = playing; stop(); reset(); els.forEach(e => e.classList.remove("on", "past")); $("#lyrics").scrollTop = 0; if (was) play(); };
$("#back").onclick = () => { stop(); $("#player").hidden = true; $("#home").hidden = false; loadQuota(); };

// Écran allumé pendant la lecture
async function wake(on) {
  try {
    if (on && "wakeLock" in navigator) lock = await navigator.wakeLock.request("screen");
    else if (lock) { await lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (playing && document.visibilityState === "visible") wake(true); });

function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function tc(str) { if (!str) return 0; return String(str).split(":").reduce((a, v) => a * 60 + parseFloat(v), 0); }

setPlayIcon();
loadQuota();
</script>
</body>
</html>
